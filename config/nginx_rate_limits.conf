# ==============================================================================
# Kepler Tech Sales AI - Nginx Reverse Proxy Per-IP Rate Limiting Configuration
# Location: /opt/basics/config/nginx_rate_limits.conf
# ==============================================================================
# Defines strict per-IP rate limit zones in the HTTP block and applies them
# to public chatbot endpoints (/chat, /quote, /history) to prevent DoS,
# quotation spamming, and scraping attacks.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Real IP Configuration (Proxy Chain / Cloudflare / Load Balancers)
# ------------------------------------------------------------------------------
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ------------------------------------------------------------------------------
# 2. Rate Limit Zones (Place inside http { ... } block in nginx.conf)
# ------------------------------------------------------------------------------

# Rate limiting key: $binary_remote_addr (uses 64 bytes per IPv4 state, memory efficient)
# For setups behind Cloudflare or AWS ALB, replace with $http_cf_connecting_ip or $realip_remote_addr.

# /chat: 30 requests/minute per client IP (allows conversational flow, blocks flooding)
limit_req_zone $binary_remote_addr zone=chat_ip_limit:10m rate=30r/m;

# /quote: 10 requests/minute per client IP (protects quote PDF & DB creation)
limit_req_zone $binary_remote_addr zone=quote_ip_limit:10m rate=10r/m;

# /history: 20 requests/minute per client IP (protects conversation state lookups)
limit_req_zone $binary_remote_addr zone=history_ip_limit:10m rate=20r/m;

# Return HTTP 429 Too Many Requests when rate limits are exceeded
limit_req_status 429;


# ------------------------------------------------------------------------------
# 2. Server Block Configuration (Place inside server { ... } block)
# ------------------------------------------------------------------------------

upstream sales_ai_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name sales.keplertech.ae;

    # SSL hardening (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Standard security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /chat endpoint: rate limited with burst buffer of 10
    location = /chat {
        limit_req zone=chat_ip_limit burst=10 nodelay;

        proxy_pass http://sales_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: 15s read timeout prevents thread exhaustion
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # /quote endpoint: rate limited with burst buffer of 5
    location = /quote {
        limit_req zone=quote_ip_limit burst=5 nodelay;

        proxy_pass http://sales_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # /history endpoint: rate limited with burst buffer of 5
    location = /history {
        limit_req zone=history_ip_limit burst=5 nodelay;

        proxy_pass http://sales_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Static assets and default fallback
    location / {
        proxy_pass http://sales_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
